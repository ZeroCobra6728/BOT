name: Live smoke test
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test public assistant
        run: |
          sleep 3
          curl --fail-with-body -sS -X POST 'https://okx-bot-analyzer.onrender.com/api/public/assistant' -H 'Content-Type: application/json' --data '{"message":"Hola, responde exactamente: IA OK","page":"dashboard","context":{}}'
