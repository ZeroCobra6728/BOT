name: Inspect runtime for backtest audit
on:
  push:
    branches: [audit-backtest]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract bundled runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, io, zipfile
          root=Path('.')
          encoded=''.join(p.read_text() for p in sorted(root.glob('runtime_bundle.part*')))
          raw=base64.b64decode(encoded)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for name in z.namelist():
                  if name.startswith('app/') and (name.endswith('.py') or name.endswith('.js')):
                      z.extract(name, 'runtime_audit')
          PY
      - name: Upload runtime source
        uses: actions/upload-artifact@v4
        with:
          name: runtime-audit-source
          path: runtime_audit/app
