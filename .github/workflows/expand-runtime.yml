name: Inspect runtime source
on:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bundled runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, io, zipfile
          root=Path(".")
          encoded="".join(p.read_text() for p in sorted(root.glob("runtime_bundle.part*")))
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(encoded))) as z:
              for name in ["app/services/ai.py","app/services/sources.py","app/main.py","app/static/app.js"]:
                  print("\n===== "+name+" =====")
                  print(z.read(name).decode())
          PY
