name: Expand runtime source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand bundled runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, io, zipfile
          root=Path(".")
          if (root/"app"/"services"/"ai.py").exists():
              raise SystemExit(0)
          encoded="".join(p.read_text() for p in sorted(root.glob("runtime_bundle.part*")))
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(encoded))) as z:
              z.extractall(root)
          PY
      - name: Commit expanded source
        run: |
          if [ -d app ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app run.py
            git diff --cached --quiet || git commit -m "chore: expand runtime source for maintainability"
            git push
          fi
